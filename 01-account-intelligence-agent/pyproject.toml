[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "account-intelligence-agent"
version = "0.1.0"
description = "Evidence-backed AI account intelligence for company research, opportunity discovery, and executive preparation."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[project.scripts]
account-intel = "account_intel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
